<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent.e1x8.xyz</title>
  <style>
    :root { color-scheme: light; --bg: #f4f7fb; --surface: #fff; --text: #17202a; --muted: #667085; --border: #d8dee4; --accent: #356ae6; --accent-text: #fff; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #10141c; --surface: #1a2230; --text: #edf2f7; --muted: #aab6c5; --border: #344154; --accent: #78a2ff; --accent-text: #10141c; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; }
    main, header, section, form, p { max-width: 760px; margin-left: auto; margin-right: auto; }
    header { align-items: center; display: flex; justify-content: space-between; padding: 36px 16px 12px; }
    header h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -0.04em; margin: 0; }
    .intro, section, #comment-form, #comments { padding-left: 16px; padding-right: 16px; }
    .intro { color: var(--muted); margin-top: 0; }
    a { color: var(--accent); }
    form { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; display: grid; gap: 10px; margin-top: 18px; padding: 16px; }
    input, textarea, button { border: 1px solid var(--border); border-radius: 9px; font: inherit; padding: 10px 12px; }
    input, textarea { background: var(--bg); color: var(--text); width: 100%; }
    textarea { min-height: 100px; resize: vertical; }
    button { background: var(--accent); color: var(--accent-text); cursor: pointer; font-weight: 650; }
    button.secondary { background: transparent; color: var(--text); }
    .comment { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin: 12px 0; padding: 14px; }
    .reply { margin-left: 28px; }
    small { color: var(--muted); } #status { min-height: 1.5em; color: var(--muted); }
    @media (max-width: 560px) { header { padding-top: 22px; } .reply { margin-left: 12px; } }
    #stove-button { margin: 18px 16px; }
    #stove-overlay { align-items: center; background: radial-gradient(circle, #ffe66d 0 8%, #ff7b22 28%, #9d1515 58%, #120b12 100%); color: #fff; display: none; inset: 0; justify-content: center; position: fixed; text-align: center; z-index: 10; }
    #stove-overlay.active { animation: blast 900ms ease-out both; display: flex; }
    #stove-overlay h2 { font-size: clamp(4rem, 20vw, 12rem); margin: 0; text-shadow: 0 6px 0 #7c1111; transform: rotate(-8deg); }
    @keyframes blast { 0% { opacity: 0; transform: scale(.2); } 35% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <header><h1>agent.e1x8.xyz</h1><button id="theme-toggle" class="secondary" type="button">Dark mode</button></header>
  <p class="intro"><a href="https://github.com/ColeTMoshe/agent-project" target="_blank" rel="noreferrer">View this project on GitHub</a><br>An evolving agent project. Explore the current community features and follow along as it grows.</p>
  <button id="stove-button" class="secondary" type="button">Light the 1985 gas stove</button>
  <section>
    <form id="auth"><input name="username" placeholder="Username" required><input name="password" type="password" minlength="8" placeholder="Password" required><span><button data-action="signup">Sign up</button> <button data-action="login">Log in</button> <button id="logout" class="secondary" type="button" hidden>Log out</button></span></form>
    <p id="status"></p>
  </section>
  <form id="comment-form"><textarea name="text" maxlength="500" placeholder="Write a comment... 😀" required></textarea><input name="parentId" type="hidden"><button>Post comment</button></form>
  <main id="comments"></main>
  <div id="stove-overlay" role="status" aria-live="assertive"><h2>BOOM!</h2></div>
  <script>
    const state = { token: localStorage.getItem('token'), comments: [] };
    const root = document.documentElement;
    const themeToggle = document.querySelector('#theme-toggle');
    const stoveButton = document.querySelector('#stove-button');
    const stoveOverlay = document.querySelector('#stove-overlay');
    const savedTheme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    function setTheme(theme) { root.dataset.theme = theme; themeToggle.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode'; localStorage.setItem('theme', theme); }
    setTheme(savedTheme);
    themeToggle.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
    stoveButton.addEventListener('click', () => { stoveOverlay.classList.add('active'); });
    const status = document.querySelector('#status');
    const comments = document.querySelector('#comments');
    const logout = document.querySelector('#logout');
    const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    function render() { const byParent = (parentId) => state.comments.filter((item) => item.parentId === parentId); const draw = (parentId, nested) => byParent(parentId).map((item) => `<article class="comment ${nested ? 'reply' : ''}"><strong>${escape(item.author.username)}</strong> <small>${new Date(item.createdAt).toLocaleString()}</small><p>${escape(item.text)}</p><button data-reply="${item.id}">Reply</button>${draw(item.id, true)}</article>`).join(''); comments.innerHTML = draw(null, false) || '<p>No comments yet.</p>'; }
    async function load() { const response = await fetch('/api/comments'); state.comments = (await response.json()).comments || []; render(); }
    function setUser(user) { logout.hidden = !user; status.textContent = user ? `Logged in as ${user.username}.` : ''; }
    document.querySelector('#auth').addEventListener('click', async (event) => { if (!event.target.dataset.action) return; event.preventDefault(); const form = new FormData(event.currentTarget); const response = await fetch('/api/' + event.target.dataset.action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.fromEntries(form)) }); const result = await response.json(); if (!response.ok) return status.textContent = result.error; state.token = result.token; localStorage.setItem('token', state.token); setUser(result.user); });
    logout.addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', headers: { authorization: `Bearer ${state.token || ''}` } }); state.token = null; localStorage.removeItem('token'); setUser(null); });
    async function restoreSession() { if (!state.token) return; const response = await fetch('/api/me', { headers: { authorization: `Bearer ${state.token}` } }); if (!response.ok) { state.token = null; localStorage.removeItem('token'); return; } setUser((await response.json()).user); }
    document.querySelector('#comment-form').addEventListener('submit', async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); const response = await fetch('/api/comments', { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${state.token || ''}` }, body: JSON.stringify(Object.fromEntries(form)) }); const result = await response.json(); if (!response.ok) return status.textContent = result.error; event.currentTarget.reset(); });
    comments.addEventListener('click', (event) => { const button = event.target.closest('[data-reply]'); if (button) document.querySelector('[name="parentId"]').value = button.dataset.reply; });
    new EventSource('/api/comments/stream').addEventListener('comment', (event) => { state.comments.unshift(JSON.parse(event.data)); render(); }); load(); render(); restoreSession();
  </script>
</body>
</html>
