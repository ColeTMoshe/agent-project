<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Files</title>
  <style>
    :root { background: #0b110b; color: #e7ffd6; font-family: ui-monospace, Consolas, monospace; }
    * { box-sizing: border-box; }
    body { background: radial-gradient(circle at 15% 0, #254d20, #0b110b 48%); margin: 0; min-height: 100vh; }
    main { margin: auto; max-width: 1100px; padding: 28px 18px; }
    header { align-items: baseline; display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; }
    h1 { color: #a9ff55; font: 900 clamp(2rem, 8vw, 4rem)/.9 system-ui; letter-spacing: -.07em; margin: 0; text-shadow: 4px 4px #163714; }
    #status { color: #a9ff55; font-weight: 700; margin: 0; }
    #workspace { border: 2px solid #70b35e; display: grid; grid-template-columns: minmax(180px, 280px) 1fr; margin-top: 24px; min-height: 570px; }
    aside { background: #101b0f; border-right: 2px solid #70b35e; padding: 14px; }
    .bar { display: flex; gap: 8px; justify-content: space-between; }
    button { background: #a9ff55; border: 2px solid #edffdb; box-shadow: 3px 3px #315b28; color: #0b1809; cursor: pointer; font: 800 .85rem/1 ui-monospace, monospace; padding: 9px 11px; }
    button:disabled { cursor: wait; opacity: .55; }
    #files { list-style: none; margin: 14px 0 0; padding: 0; }
    #files button { background: transparent; border: 0; box-shadow: none; color: #c9f6bd; overflow: hidden; padding: 10px 4px; text-align: left; text-overflow: ellipsis; white-space: nowrap; width: 100%; }
    #files button.active { color: #a9ff55; text-decoration: underline; }
    #editor { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; padding: 14px; }
    #name, #content { background: #071006; border: 2px solid #4f8b42; color: #edffdb; font: 1rem/1.4 ui-monospace, Consolas, monospace; width: 100%; }
    #name { padding: 10px; }
    #content { margin-top: 12px; padding: 14px; resize: none; }
    #content:disabled, #name:disabled { opacity: .5; }
    #actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
    #delete { background: #ff9c88; }
    .github-link { color: #a9ff55; display: inline-block; font-weight: 900; margin-top: 18px; }
    @media (max-width: 650px) { #workspace { grid-template-columns: 1fr; } aside { border-bottom: 2px solid #70b35e; border-right: 0; } #files { display: block; overflow: visible; } #files button { min-width: 0; } #workspace { min-height: 620px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>SHARED FILES</h1><p id="status" aria-live="polite">Connecting...</p></header>
    <section id="workspace" aria-label="Shared file manager">
      <aside><div class="bar"><strong>FILES</strong><button id="new-file" type="button">+ NEW</button><button id="spam-files" type="button">SPAM 10</button></div><ul id="files"></ul></aside>
      <section id="editor"><input id="name" aria-label="File name" disabled><textarea id="content" aria-label="File content" disabled spellcheck="false"></textarea><div id="actions"><button id="delete" type="button" disabled>DELETE</button><button id="save" type="button" disabled>SAVE</button></div></section>
    </section>
    <a class="github-link" href="https://github.com/ColeTMoshe/agent-project">GitHub</a>
  </main>
  <script>
    const status = document.querySelector('#status');
    const fileList = document.querySelector('#files');
    const name = document.querySelector('#name');
    const content = document.querySelector('#content');
    const newFile = document.querySelector('#new-file');
    const spamFiles = document.querySelector('#spam-files');
    const save = document.querySelector('#save');
    const remove = document.querySelector('#delete');
    let files = [];
    let selectedId = null;
    let dirty = false;
    function selected() { return files.find((file) => file.id === selectedId); }
    function draw() { if (!selected() && files.length) selectedId = files[0].id; const file = selected(); fileList.replaceChildren(...files.map((item) => { const button = document.createElement('button'); button.type = 'button'; button.textContent = item.name; button.classList.toggle('active', item.id === selectedId); button.addEventListener('click', () => { selectedId = item.id; dirty = false; draw(); }); const line = document.createElement('li'); line.append(button); return line; })); name.disabled = !file; content.disabled = !file; save.disabled = !file; remove.disabled = !file; if (!file) { name.value = ''; content.value = ''; return; } name.value = file.name; if (!dirty) content.value = file.content; }
    function sync(update) { const previousId = selectedId; files = update.files || []; if (!selected()) selectedId = files[0]?.id || null; if (selectedId !== previousId) dirty = false; draw(); }
    async function request(url, options) { const response = await fetch(url, options); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Request failed.'); return result; }
    newFile.addEventListener('click', async () => { const base = 'untitled.txt'; let suffix = 1; let fileName = base; while (files.some((file) => file.name === fileName)) fileName = `untitled-${suffix++}.txt`; try { sync(await request('/api/files', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: fileName }) })); selectedId = files.find((file) => file.name === fileName)?.id || selectedId; draw(); status.textContent = 'New shared file.'; } catch (error) { status.textContent = error.message; } });
    spamFiles.addEventListener('click', async () => { spamFiles.disabled = true; try { sync(await request('/api/files/spam', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ quantity: 10 }) })); status.textContent = 'Ten shared spam files deployed.'; } catch (error) { status.textContent = error.message; } spamFiles.disabled = false; });
    content.addEventListener('input', () => { dirty = true; status.textContent = 'Unsaved changes.'; });
    name.addEventListener('input', () => { dirty = true; status.textContent = 'Unsaved changes.'; });
    save.addEventListener('click', async () => { const file = selected(); if (!file) return; save.disabled = true; try { sync(await request(`/api/files/${file.id}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name.value, content: content.value }) })); dirty = false; status.textContent = 'Saved for everyone.'; } catch (error) { status.textContent = error.message; } draw(); });
    remove.addEventListener('click', async () => { const file = selected(); if (!file) return; remove.disabled = true; try { sync(await request(`/api/files/${file.id}`, { method: 'DELETE' })); dirty = false; status.textContent = 'Deleted for everyone.'; } catch (error) { status.textContent = error.message; } draw(); });
    fetch('/api/files').then((response) => response.json()).then(sync).catch((error) => { status.textContent = error.message; });
    function connect() { const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); socket.addEventListener('open', () => { status.textContent = 'Live workspace connected.'; }); socket.addEventListener('message', (event) => { const update = JSON.parse(event.data); if (update.type === 'files') { sync(update); if (!dirty) status.textContent = 'Someone changed the workspace.'; } }); socket.addEventListener('close', () => { status.textContent = 'Reconnecting...'; setTimeout(connect, 1_000); }); }
    connect();
  </script>
</body>
</html>
