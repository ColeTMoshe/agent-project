<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Clicker</title>
  <style>
    :root { background: #061b0d; color: #e8ffe9; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: radial-gradient(circle at 50% 0, #19783a, #061b0d 55%); display: flex; margin: 0; min-height: 100vh; overflow-x: hidden; text-align: center; }
    main { margin: auto; max-width: 680px; padding: 28px 18px; width: 100%; }
    h1 { font-size: clamp(3rem, 12vw, 7rem); letter-spacing: -.08em; line-height: .82; margin: 0; text-shadow: 5px 5px 0 #0c3e1c, -4px -4px 0 #8cff5d; }
    p { color: #a9e8ae; font-weight: 700; }
    #total { color: #baff70; display: block; font-size: clamp(4rem, 18vw, 10rem); letter-spacing: -.08em; line-height: 1; text-shadow: 0 0 32px #2fff68; }
    #clicker { aspect-ratio: 1; background: conic-gradient(#24d65e, #baff70, #a4ffbc, #087b35, #24d65e); border: 10px solid #e8ffe9; border-radius: 50%; box-shadow: 0 16px 0 #075020, 0 22px 45px #0009; color: #031108; cursor: pointer; font: 900 clamp(1.2rem, 5vw, 2.1rem)/1 system-ui; margin: 24px auto 34px; max-width: 300px; padding: 20px; transform: rotate(-4deg); transition: transform 80ms, box-shadow 80ms; width: 76vw; }
    #clicker:active { box-shadow: 0 4px 0 #075020, 0 8px 20px #0009; transform: translateY(12px) rotate(4deg) scale(.96); }
    #clicker:focus-visible { outline: 5px solid #fff; outline-offset: 7px; }
    #feed { color: #baff70; min-height: 1.5em; }
    #rewards { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0; }
    .reward { background: #0c3e1c; border: 2px solid #287b42; border-radius: 999px; color: #7cae81; padding: 7px 11px; }
    .reward.unlocked { border-color: #baff70; color: #e8ffe9; }
    #shop { background: #07150b; border: 3px dashed #baff70; border-radius: 14px; color: #e8ffe9; margin: 22px auto 0; max-width: 390px; padding: 14px; }
    #shop h2 { color: #baff70; font-size: 1.2rem; margin: 0 0 8px; }
    #bird { font-size: 2rem; margin: 0; }
    .pop { animation: pop 700ms ease-out forwards; color: #fff; font-size: 2rem; font-weight: 900; pointer-events: none; position: fixed; text-shadow: 2px 2px #148c3c; }
    #gnome { bottom: 12px; cursor: pointer; font-size: 3rem; position: fixed; right: 16px; }
    @keyframes pop { to { opacity: 0; transform: translateY(-110px) rotate(30deg) scale(1.8); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <h1>G. SPAMTON'S<br>GREEN CLICKER</h1>
    <p>Click together. Grow the number.</p>
    <strong id="total" aria-live="polite">0</strong>
    <button id="clicker" type="button">CLICK IT!!!</button>
    <p id="feed" aria-live="polite">Waiting for clicks from everywhere.</p>
    <p id="cps">0 clicks/sec</p>
    <section id="rewards" aria-label="Milestone rewards"><span class="reward" data-milestone="10">10: Greenhorn</span><span class="reward" data-milestone="50">50: Birdvirus</span><span class="reward" data-milestone="100">100: Big Shot</span></section>
    <section id="shop"><h2>G. SPAMTON'S GREEN SHOP</h2><p>Milestones unlock nonsense.</p><p id="bird" hidden>🕊️ BIRDVIRUS UNLOCKED</p></section>
    <section id="upgrades"><button data-upgrade="double">Double +1 (15)</button><button data-upgrade="auto">Auto click (50)</button><button data-upgrade="boost">Boost (600)</button></section>
  </main>
  <button id="gnome" type="button" aria-label="Angry gnome">🧙</button>
  <script>
    const total = document.querySelector('#total');
    const clicker = document.querySelector('#clicker');
    const feed = document.querySelector('#feed');
    const rewards = [...document.querySelectorAll('.reward')];
    const bird = document.querySelector('#bird');
    const gnome = document.querySelector('#gnome');
    let clicks = 0;
    let lastClicks = 0;
    function draw() { total.textContent = clicks.toLocaleString('en-US'); document.title = `${clicks.toLocaleString('en-US')} - Green Clicker`; rewards.forEach((reward) => reward.classList.toggle('unlocked', clicks >= Number(reward.dataset.milestone))); bird.hidden = clicks < 50; }
    function pop() { const item = document.createElement('span'); item.className = 'pop'; item.textContent = ['+1', 'GREEN!', 'GO!', '⚡'][Math.floor(Math.random() * 4)]; item.style.left = `${20 + Math.random() * 60}%`; item.style.top = `${35 + Math.random() * 35}%`; item.addEventListener('animationend', () => item.remove()); document.body.append(item); }
    gnome.addEventListener('click', () => { const tomato = document.createElement('span'); tomato.className = 'pop'; tomato.textContent = '🍅'; tomato.style.left = '82%'; tomato.style.top = '78%'; tomato.addEventListener('animationend', () => tomato.remove()); document.body.append(tomato); });
    clicker.addEventListener('click', async () => { const response = await fetch('/api/clicker', { method: 'POST' }); const result = await response.json(); if (!response.ok) return feed.textContent = result.error; clicks = result.clicks; draw(); pop(); gnome.textContent = ['🧙', '🧙🍅', '🧙⚡'][clicks % 3]; });
    document.querySelector('#upgrades').addEventListener('click', async (event) => { const type = event.target.dataset.upgrade; if (!type) return; const response = await fetch('/api/clicker/upgrade', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type }) }); const result = await response.json(); if (!response.ok) return feed.textContent = result.error; clicks = result.clicks; draw(); });
    fetch('/api/clicker').then((response) => response.json()).then((result) => { clicks = result.clicks || 0; draw(); });
    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`); socket.addEventListener('message', (event) => { const update = JSON.parse(event.data); if (update.type === 'clicks') { clicks = update.clicks; draw(); feed.textContent = 'Someone clicked the world.'; } });
    setInterval(() => { document.querySelector('#cps').textContent = `${clicks - lastClicks} clicks/sec`; lastClicks = clicks; }, 1000);
    document.addEventListener('keydown', (event) => { if (event.key.toLowerCase() === 'c' && !event.repeat && document.activeElement === document.body) clicker.click(); });
  </script>
</body>
</html>
